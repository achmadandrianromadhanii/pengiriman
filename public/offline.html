<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Offline — SoftSend</title>
    <!-- ================================================================= -->
    <!-- HALAMAN OFFLINE — PWA Fallback                                    -->
    <!-- ================================================================= -->
    <!-- Fungsi: Ditampilkan oleh Service Worker saat user membuka          -->
    <!--         halaman tanpa koneksi internet.                            -->
    <!-- Cara Kerja: SW mencocokkan cache 'softsend-v1' → serve file ini.  -->
    <!-- Catatan: File ini HARUS ringan (inline CSS, tanpa external assets) -->
    <!--          karena di-serve dari cache saat offline.                  -->
    <!-- ================================================================= -->
    <style>
        /* [OFFLINE PAGE] Reset dasar dan styling minimalis */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0E1117;
            color: #E2E8F0;
            padding: 24px;
        }
        .container {
            text-align: center;
            max-width: 380px;
        }
        /* Ikon wifi-off sederhana menggunakan SVG inline */
        .icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 24px;
            border-radius: 24px;
            background: rgba(59, 130, 246, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .icon svg {
            width: 40px;
            height: 40px;
            stroke: #3B82F6;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        h1 {
            font-size: 22px;
            font-weight: 800;
            margin-bottom: 8px;
            color: #F8FAFC;
        }
        p {
            font-size: 14px;
            color: #94A3B8;
            line-height: 1.6;
            margin-bottom: 28px;
        }
        /* Tombol coba lagi */
        button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 14px 32px;
            border-radius: 16px;
            border: none;
            background: #2349F5;
            color: #fff;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        button:active { opacity: 0.8; transform: scale(0.97); }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">
            <!-- SVG icon: Wifi Off (inline agar tidak butuh external asset) -->
            <svg viewBox="0 0 24 24">
                <line x1="1" y1="1" x2="23" y2="23"/>
                <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/>
                <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"/>
                <path d="M10.71 5.05A16 16 0 0 1 22.56 9"/>
                <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"/>
                <path d="M8.53 16.11a6 6 0 0 1 6.95 0"/>
                <line x1="12" y1="20" x2="12.01" y2="20"/>
            </svg>
        </div>
        <h1>Tidak Ada Koneksi</h1>
        <p>Perangkat Anda sedang offline. Periksa koneksi internet dan coba lagi.</p>
        <button onclick="window.location.reload()">
            <!-- SVG icon: Refresh -->
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="23 4 23 10 17 10"/>
                <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
            </svg>
            Coba Lagi
        </button>
    </div>
</body>
</html>
